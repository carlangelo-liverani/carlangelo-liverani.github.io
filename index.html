<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Carlangelo Liverani</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(180deg, #eef4f7 0%, #dce8ee 100%);
    text-align: center;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }

  h1 {
    margin: 0;
    font-size: 3.2rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #00acc1;
    text-shadow: 0 0 20px rgba(0, 172, 193, 0.25);
  }

  .line {
    width: 60px;
    height: 2px;
    background: #00acc1;
    opacity: 0.5;
    margin: 0.35rem 0;
  }

  p {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #607080;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Carlangelo Liverani</h1>
    <div class="line"></div>
    <p>web page,<br>soon to appear</p>
  </div>
</body>
</html>
